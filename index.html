<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérsejt Elemző Rendszer</title>
    <style>
        /* --- ALAPVETŐ STÍLUSOK (Modern Hematológiai Téma) --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #2c3e50;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 950px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(138, 3, 3, 0.05), 0 5px 15px rgba(0,0,0,0.03);
        }

        h1 {
            color: #8b0000;
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #d32f2f, #8b0000);
            border-radius: 2px;
        }

        /* --- FELTÖLTŐ SZEKCIÓ --- */
        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
            padding: 40px 20px;
            background-color: #fff9f9;
            border: 2px dashed #ffcdd2;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .upload-section:hover {
            border-color: #ef5350;
            background-color: #fff5f5;
        }

        .instruction-text {
            font-weight: 500;
            color: #666;
            font-size: 1.1em;
            margin: 0;
        }

        /* Szép, nagy központi gomb */
        button.action-btn {
            background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 16px rgba(183, 28, 28, 0.3);
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(183, 28, 28, 0.4);
        }

        button.action-btn:active {
            transform: translateY(0);
        }

        button.action-btn:disabled {
            background: #9e9e9e;
            box-shadow: none;
            cursor: wait;
            transform: none;
        }

        /* --- EREDMÉNYEK SZEKCIÓ --- */
        #resultsSection {
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        .prediction-box {
            background-color: #ffebee;
            border-left: 6px solid #d32f2f;
            padding: 18px 25px;
            margin-bottom: 30px;
            border-radius: 8px;
            font-size: 1.3em;
            font-weight: 700;
            color: #b71c1c;
            text-align: center;
            box-shadow: 0 2px 8px rgba(211, 47, 47, 0.1);
        }

        .image-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .image-card {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            border: 1px solid #f0f0f0;
            text-align: center;
            flex: 1;
            min-width: 300px;
            max-width: 450px;
        }

        .image-card h3 {
            margin-top: 5px;
            margin-bottom: 15px;
            color: #455a64;
            font-size: 1.1em;
            font-weight: 600;
        }

        .image-card img {
            width: 100%;
            height: 280px; 
            object-fit: contain; 
            border-radius: 8px;
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vérsejt Elemző Rendszer</h1>
        
        <div class="upload-section">
            <p class="instruction-text">Kattints a gombra egy vérsejt mikroszkópos felvétel kiválasztásához</p>
            
            <!-- A fájl bemenet rejtve van, de ha megváltozik az értéke, egyből hívja a függvényt -->
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="uploadImage()">
            
            <!-- Ez a gomb csak szimulálja a rejtett fájl bemenetre való kattintást -->
            <button id="uploadBtn" class="action-btn" onclick="document.getElementById('imageInput').click()">
                Kép kiválasztása és Elemzés
            </button>
        </div>

        <div id="resultsSection">
            <div class="prediction-box" id="resultText">
                Ide kerül az eredmény...
            </div>

            <div class="image-grid">
                <div class="image-card">
                    <h3>Eredeti felvétel</h3>
                    <img id="originalImage" alt="Eredeti vérsejt kép">
                </div>
                <div class="image-card">
                    <h3>Grad-CAM (Hálózat fókusza)</h3>
                    <img id="gradcamImage" alt="Grad-CAM hőtérkép">
                </div>
            </div>
        </div>
    </div>

    <script>
        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const uploadBtn = document.getElementById('uploadBtn');
            
            // Ha a felhasználó megnyitotta a fájlválasztót, de mégse választott semmit (Mégse gomb)
            if (fileInput.files.length === 0) {
                return; 
            }

            const file = fileInput.files[0];

            // Eredeti kép azonnali megjelenítése
            const originalImgUrl = URL.createObjectURL(file);
            document.getElementById('originalImage').src = originalImgUrl;

            // UI frissítése töltés közben
            uploadBtn.disabled = true;
            uploadBtn.innerText = "Elemzés folyamatban, kérlek várj...";
            
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.style.display = "block";
            
            const resultText = document.getElementById('resultText');
            resultText.innerText = "Feldolgozás és Grad-CAM generálása folyamatban...";
            
            // Stílusok alaphelyzetbe állítása
            resultText.style.borderLeftColor = "#d32f2f";
            resultText.style.color = "#b71c1c";
            resultText.style.backgroundColor = "#ffebee";

            document.getElementById('gradcamImage').src = ""; 
            document.getElementById('gradcamImage').alt = "Kép generálása...";

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://localhost:5000/process-image', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Szerver hiba történt! (Státusz kód: " + response.status + ")");
                }

                const data = await response.json();

                // Szöveges predikció kiírása
                resultText.innerText = data.prediction;
                
                // Grad-CAM kép megjelenítése
                const gradcamImgElement = document.getElementById('gradcamImage');
                gradcamImgElement.src = "data:image/jpeg;base64," + data.image_data;
                gradcamImgElement.alt = "Generált Grad-CAM hőtérkép";

            } catch (error) {
                console.error("Hiba:", error);
                resultText.innerText = "Hiba történt a szerverrel való kommunikáció során: " + error.message;
                
                resultText.style.borderLeftColor = "#ff9800";
                resultText.style.color = "#e65100";
                resultText.style.backgroundColor = "#fff3e0";
            } finally {
                // Állapot visszaállítása
                uploadBtn.disabled = false;
                uploadBtn.innerText = "Újabb kép kiválasztása és Elemzés";
                
                // Fontos: ürítsük ki az input értékét, hogy ha a felhasználó zsinórban kétszer 
                // ugyanazt a képet választja ki, akkor is érzékelje az "onchange" eseményt!
                fileInput.value = "";
            }
        }
    </script>
</body>
</html>
